name: Cartes du profil

# L'instance publique github-readme-stats est instable et ne sait pas compter tous les commits :
# les cartes sont générées ici chaque nuit et versionnées dans profile/.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cartes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LimHounTchenAime&show_icons=true&hide_rank=true&locale=fr&include_all_commits=true&hide=issues
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LimHounTchenAime&layout=compact&locale=fr
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Mise à jour des cartes du profil" || exit 0
          git push
